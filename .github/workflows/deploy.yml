name: Deploy to Firebase

on:
  push:
    branches:
      - main
      - claude/implement-app-first-version-KEoSp
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "20"
  FIREBASE_TOOLS_VERSION: "13.29.1"

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install root deps
        run: npm ci

      - name: Install functions deps
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: Build functions
        working-directory: functions
        run: npm run build

      - name: Write Next.js production env
        run: |
          cat > .env.production <<EOF
          NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
          EOF

      - name: Write functions env (parameterized config)
        run: |
          cat > functions/.env <<EOF
          APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
          EOF

      - name: Authenticate to Firebase
        run: |
          printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
        shell: bash

      - name: Install firebase-tools
        run: npm install -g firebase-tools@${{ env.FIREBASE_TOOLS_VERSION }}

      - name: Enable web frameworks
        run: firebase experiments:enable webframeworks

      - name: Deploy
        shell: bash
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          GCLOUD_PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLI_EXPERIMENTS: webframeworks
        run: |
          set +e
          firebase deploy \
            --only firestore:rules,firestore:indexes,storage,functions,hosting \
            --project ${{ secrets.FIREBASE_PROJECT_ID }} \
            --non-interactive \
            --force 2>&1 | tee /tmp/deploy.log
          code=${PIPESTATUS[0]}
          set -e

          if [ "$code" -eq 0 ]; then
            exit 0
          fi

          # Tolera só o caso "cleanup policy não foi setada após Functions OK".
          if grep -q "could not set up cleanup policy" /tmp/deploy.log \
             && grep -q "Functions successfully deployed" /tmp/deploy.log; then
            echo "::warning::Cleanup policy auto-setup falhou apesar de --force; setando explicitamente e continuando"
            firebase functions:artifacts:setpolicy \
              --location us-east1 \
              --days 7 \
              --project ${{ secrets.FIREBASE_PROJECT_ID }} \
              --non-interactive \
              --force
            firebase deploy \
              --only hosting \
              --project ${{ secrets.FIREBASE_PROJECT_ID }} \
              --non-interactive \
              --force
            exit 0
          fi

          exit "$code"
