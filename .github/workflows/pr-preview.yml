name: PR preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches-ignore:
      - main
      - claude/restart

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: preview-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verificar-pr:
    name: Verificar PR aberto
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
      canal: ${{ steps.check.outputs.canal }}
    steps:
      - name: Checar PR aberto e definir canal
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "canal=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PR=$(gh pr list \
            --repo "${{ github.repository }}" \
            --head "${{ github.ref_name }}" \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [ -z "$PR" ]; then
            echo "Sem PR aberto para ${{ github.ref_name }}. Pulando deploy."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "PR #$PR encontrado."
          echo "deploy=true" >> "$GITHUB_OUTPUT"
          echo "canal=pr-$PR" >> "$GITHUB_OUTPUT"

  preview:
    name: Hosting preview channel
    needs: verificar-pr
    if: >-
      needs.verificar-pr.outputs.deploy == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_USE_EMULATORS: "0"
        run: npm run build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          channelId: ${{ needs.verificar-pr.outputs.canal }}
          expires: 7d
